[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drunk-mcp-proxy"
version = "0.1.0"
description = "MCP proxy server"
readme = "README.md"
requires-python = ">=3.10"

# Runtime dependencies (migrated from requirements.txt)
dependencies = [
    "fastmcp>=3.0.0rc1",
    "jsonschema>=4.0.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-core>=2.41.5",
    "openai>=1.0.0",
    "fastapi>=0.110.0",
    "pandas>=2.2.0",
    "botocore>=1.35.0",
    "starlette>=0.34.0",
    "httpx>=0.6.7",
    "py-key-value-aio[disk,keyring,memory,redis]>=0.4.0",
    "key-value>=0.1.2",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# Development-only dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "flake8>=7.3.0",
    "pyright>=1.1.408",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
