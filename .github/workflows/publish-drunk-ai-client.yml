name: Publish drunk-ai-client

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/drunk_ai_client/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          version: latest

      - name: Build package
        working-directory: src/drunk_ai_client
        run: uv build

      - name: Publish to PyPI
        working-directory: src/drunk_ai_client
        run: uv publish
