services:
  mcp-proxy:
    build: .
    image: drunk-mcp-proxy:latest
    container_name: mcp-proxy-server
    ports:
      - "8000:8000"
    volumes:
      # Mount data directory for all configuration files
      - ./data:/app/data
    environment:
      - MCP_CONFIG_FILE=/app/data/mcp.json
      - MCP_PROXIES_FILE=/app/data/proxies.json
      - MCP_AUTH_CONFIG_FILE=/app/data/auth.json
      - PYTHONPATH=/app/src
    restart: unless-stopped
