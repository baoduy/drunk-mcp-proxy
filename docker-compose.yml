services:
  mcp-proxy:
    build: .
    image: drunk-mcp-proxy:latest
    container_name: mcp-proxy-server
    ports:
      - "${FASTMCP_PORT:-9123}:${FASTMCP_PORT:-9123}"
    volumes:
      # Mount data directory for all configuration files
      - ./data:/drunk-proxy/data
      # Mount pip cache for persistent package cache across restarts
      - mcp-pip-cache:/tmp/pip-cache
      # Mount user home for uv and npm caches
      - mcp-home-cache:/home/appuser
    env_file:
      - .env
    environment:
      - FASTMCP_HOST=0.0.0.0
      - FASTMCP_PORT=${FASTMCP_PORT:-9123}
      - FASTMCP_AUTH_ENABLED=${FASTMCP_AUTH_ENABLED:-true}
      - FASTMCP_API_KEY=${FASTMCP_API_KEY}
      - FASTMCP_SERVER_NAME=${FASTMCP_SERVER_NAME:-mcp-proxy-server}
      - FASTMCP_SERVER_VERSION=${FASTMCP_SERVER_VERSION:-1.0.0}
      - FASTMCP_OAUTH_STORAGE_ENCRYPTION_KEY=${FASTMCP_OAUTH_STORAGE_ENCRYPTION_KEY}
      - FASTMCP_OAUTH_STORAGE_TYPE=redis
      - FASTMCP_REDIS_CONNECTION_STRING=redis://redis:6379
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9123/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: mcp-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    container_name: mcp-inspector
    ports:
      - "127.0.0.1:6274:6274"
      - "127.0.0.1:6277:6277"
    environment:
      - HOST=0.0.0.0
      - MCP_AUTO_OPEN_ENABLED=false
    restart: unless-stopped
    networks:
      - mcp-network

  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    ports:
      - "3000:8080"
    environment:
      - WEBUI_AUTH=false
      - WEBUI_SECRET_KEY=Dj3EFkjbwL9NaLjXTBn7
      - ENABLE_OLLAMA_API=false
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://mcp-proxy-server:9123/api/v1
      - OPENAI_API_KEY=${FASTMCP_API_KEY}
    volumes:
      - openwebui-data:/app/backend/data
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge

volumes:
  # Named volumes for persistent caching
  mcp-pip-cache:
    driver: local
  mcp-home-cache:
    driver: local
  openwebui-data:
    driver: local
